<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Marcos Luiz Martins</title>
  <desc id="desc">Banner animado sobre infraestrutura, automação e segurança</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.48" stop-color="#10244A"/>
      <stop offset="1" stop-color="#07111F"/>
      <animate attributeName="x1" values="0;300;0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1200;900;1200" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accent" x1="210" y1="0" x2="990" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#22D3EE" stop-opacity=".38"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#94A3B8" stroke-opacity=".08"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="26" fill="url(#grid)"/>
  <circle cx="180" cy="85" r="180" fill="url(#glow)">
    <animate attributeName="cx" values="180;340;180" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1030" cy="250" r="210" fill="url(#glow)" opacity=".55">
    <animate attributeName="cy" values="250;170;250" dur="11s" repeatCount="indefinite"/>
  </circle>

  <g fill="#22D3EE">
    <circle cx="116" cy="230" r="3"><animate attributeName="cy" values="230;205;230" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1074" cy="87" r="3"><animate attributeName="cy" values="87;112;87" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="988" cy="238" r="2" fill="#A78BFA"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="72" r="2" fill="#A78BFA"><animate attributeName="opacity" values="1;.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <text x="600" y="126" text-anchor="middle" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="750" letter-spacing="2" filter="url(#shadow)">MARCOS LUIZ MARTINS</text>
  <rect x="270" y="151" width="660" height="3" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="180;660;180" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="510;270;510" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="600" y="196" text-anchor="middle" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" letter-spacing="5">BUILD  •  VERIFY  •  DOCUMENT</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#67E8F9">
    <text x="600" y="250" opacity="0">LINUX · REDES · PYTHON · AUTOMAÇÃO
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.28;.34;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="250" opacity="0">INFRAESTRUTURA · CLOUD · IAM
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.28;.34;1" dur="9s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="250" opacity="0">CLOUD SECURITY · APPSEC · AI SECURITY
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.28;.34;1" dur="9s" begin="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="600" y="292" text-anchor="middle" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">roadmap_2026_2028 :: 840_days :: evidence_driven</text>
</svg>
